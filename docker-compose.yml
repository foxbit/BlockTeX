services:
  blocktex-web:
    build:
      context: ./frontend
    container_name: blocktex-web
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - blocktex-api
    networks:
      - blocktex-net

  blocktex-api:
    build:
      context: ./backend
    container_name: blocktex-api
    ports:
      - "3001:3001"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - blocktex-data:/app/data
    networks:
      - blocktex-net

networks:
  blocktex-net:
    driver: bridge

volumes:
  blocktex-data:
