<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockTeX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f0f13;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      animation: fadeIn 0.6s ease;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
    }

    .logo-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #e0e0ff, #a5b4fc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text span {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loader-container {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .loader-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
      background-size: 200% 100%;
      border-radius: 99px;
      animation: slide 1.4s infinite ease-in-out, shimmer 1.4s infinite linear;
    }

    .status {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
      animation: fadeIn 1s ease 0.3s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      50%  { transform: translateX(250%); }
      100% { transform: translateX(-100%); }
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div class="logo-text">Block<span>TeX</span></div>
  </div>
  <div class="loader-container">
    <div class="loader-bar"></div>
  </div>
  <div class="status">Iniciando o editor...</div>
</body>
</html>
