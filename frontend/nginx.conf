server {
    listen 80;
    server_name localhost;

    # Arquivos estáticos do frontend (React build)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API REST do backend
    location /api/ {
        proxy_pass http://blocktex-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tratamento específico para WebSockets, enviando pro backend
    location /ws {
        proxy_pass http://blocktex-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
